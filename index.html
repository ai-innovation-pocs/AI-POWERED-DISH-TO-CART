<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Ingredients</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Recipe Ingredients</h1>
<form id="upload-form">
<input type="file" name="image" accept="image/*" capture="camera" id="image-input">
<div id="image-preview-container" style="display: inline-block; margin-left: 10px;"></div>
<br><br>
<input type="number" name="persons" placeholder="For Number Of People?" min="1" value="1">
<br><br>
<input type="submit" value="Get your Recipe Ingredients">
</form>
<div id="result"></div>
<script src="script.js"></script>
<script>
   document.getElementById('image-input').addEventListener('change', function(event) {
     const file = event.target.files[0];
     const reader = new FileReader();
     reader.onload = function(e) {
       const previewContainer = document.getElementById('image-preview-container');
       previewContainer.innerHTML = `<img src="${e.target.result}" alt="Image Preview" style="max-width:100px; max-height:100px;">`;
     };
     reader.readAsDataURL(file);
   });
</script>
</body>
</html>
